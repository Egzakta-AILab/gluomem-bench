[project]
name = "gluomem-bench"
version = "0.1.0"
description = "Benchmark harness, offline tuner, and DSPy prompt optimization for GluoMem"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Egzakta" }]
requires-python = ">=3.11"
dependencies = [
    "gluomem>=0.1.0",
    "dspy>=3.4.1",
    "optuna>=4.0",
]

[project.optional-dependencies]
beam = ["pyarrow>=20"]
mem0 = [
    "mem0ai>=0.1",
]
embeddings = [
    "sentence-transformers>=3.0",
]
all = [
    "gluomem-bench[mem0,embeddings,beam]",
]

[project.scripts]
gluomem-bench = "gluomem_bench.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyrefly",
    "pre-commit>=4.6.1",
]

[tool.uv.sources]
gluomem = { path = "../GluoMem", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gluomem_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that download/load real models or call live APIs",
]
addopts = "-m 'not slow'"

[tool.pyrefly]
search-path = [
    ".",
    "../GluoMem",
]
project-excludes = [
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
]
replace-imports-with-any = [
    "alembic",
    "alembic.*",
    "fastapi",
    "fastapi.*",
    "httpx",
    "httpx.*",
    "mem0",
    "mem0.*",
    "optuna",
    "optuna.*",
    "pyarrow",
    "pyarrow.*",
    "pgvector",
    "pgvector.*",
    "psycopg",
    "psycopg.*",
    "psycopg_pool",
    "psycopg_pool.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "uvicorn",
    "uvicorn.*",
]
